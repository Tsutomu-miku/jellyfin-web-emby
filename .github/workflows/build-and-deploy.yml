name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      jellyfin_web_version:
        description: 'Jellyfin Web version/tag to build from'
        required: false
        default: 'v10.10.7'
        type: string

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JELLYFIN_WEB_VERSION: ${{ github.event.inputs.jellyfin_web_version || 'v10.10.7' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache jellyfin-web node_modules
        uses: actions/cache@v4
        with:
          path: .build/jellyfin-web/node_modules
          key: jf-web-${{ env.JELLYFIN_WEB_VERSION }}-${{ hashFiles('build.sh') }}

      - name: Build
        run: |
          chmod +x build.sh
          bash build.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
